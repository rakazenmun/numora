name: Build Numora WASM

on:
  push:
    branches: [ main, master, wasm-web-ui ]
  pull_request:
    branches: [ main, master, wasm-web-ui ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3 python3-pip git

      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh
          cd ..

      - name: Build numora.js
        run: |
          set -euo pipefail
          source emsdk/emsdk_env.sh
          chmod +x build.sh || true
          ./build.sh

      - name: Commit generated WASM artifacts
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- numora.js numora.wasm; then
            echo "No WASM artifacts changed."
            exit 0
          fi

          git add numora.js numora.wasm
          git commit -m "chore: update wasm artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: numora-wasm
          path: |
            numora.js
            numora.wasm
